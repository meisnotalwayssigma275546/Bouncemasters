<!DOCTYPE html>
<html>

<head>

    <!-- The base tag makes every RELATIVE address (images, sounds, json, css) load from jsDelivr.
         That is why your own mod.js and game.js were never used: "mod.js" became
         cdn.jsdelivr.net/.../mod.js. The loader below builds addresses from the page's own URL instead. -->
    <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/bouncemasters/">
    <title>Bouncemasters</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="msapplication-tap-highlight" content="no"/>
    <meta name="MobileOptimized" content="960"/>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui"/>
    <meta charset="utf-8"/>

    <link rel="stylesheet" type="text/css" href="style/index.css" nonce="KA1eZH6AAF8sVJT2PFen-g"/>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js" nonce="KA1eZH6AAF8sVJT2PFen-g"></script>

    <script>
    (function () {
        // folder this page was opened from (location.href ignores the base tag)
        var root = location.href.replace(/[?#].*$/, "").replace(/[^\/]*$/, "");
        function load(file, next) {
            var s = document.createElement("script");
            s.src = root + file + "?v=" + Date.now();   // skip stale cached copies while testing
            s.onload = next;
            s.onerror = function () { console.error("could not load " + s.src); };
            document.head.appendChild(s);
        }
        function start() {
            if (document.readyState === "complete") window.runGame();
            else window.addEventListener("load", function () { window.runGame(); });
        }
        // order matters: mod.js first (saving shim), then the patched game, then start
        load("mod.js", function () { load("game.js", start); });
    })();
    </script>
</head>


<body>
    <div id="game"></div>
</body>
</html>
